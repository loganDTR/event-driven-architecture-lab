name: event-driven-lab

services:
  redpanda:
    image: docker.io/redpandadata/redpanda:${REDPANDA_VERSION:-v26.1.13}
    container_name: eventlab-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
    ports:
      - "19092:19092" # Kafka API from host
      - "18081:18081" # Schema Registry from host
      - "18082:18082" # HTTP Proxy from host
      - "19644:9644"  # Admin API from host
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - eventlab
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  console:
    image: docker.io/redpandadata/console:${REDPANDA_CONSOLE_VERSION:-v3.8.0}
    container_name: eventlab-console
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml && /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers:
            - redpanda:9092
        schemaRegistry:
          enabled: true
          urls:
            - http://redpanda:8081
        redpanda:
          adminApi:
            enabled: true
            urls:
              - http://redpanda:9644
    ports:
      - "8080:8080"
    networks:
      - eventlab
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:${POSTGRES_VERSION:-18.4}
    container_name: eventlab-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventlab}
      POSTGRES_USER: ${POSTGRES_USER:-eventlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventlab_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - eventlab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

networks:
  eventlab:
    name: eventlab-network
    driver: bridge

volumes:
  redpanda_data:
    name: eventlab-redpanda-data
  postgres_data:
    name: eventlab-postgres-data
